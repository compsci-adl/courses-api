name: Scraper
permissions:
  contents: read

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      probe_hosts:
        description: 'Run direct host probe and exit without scraping'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: ap-southeast-2

jobs:
  run-scraper:
    name: Run Scraper
    runs-on: ubuntu-latest
    environment: Scraper

    env:
      DEFAULT_LOGGING_LEVEL: ${{ secrets.DEFAULT_LOGGING_LEVEL }}
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Create .env file
        run: |
          echo "DEFAULT_LOGGING_LEVEL=${{ env.DEFAULT_LOGGING_LEVEL }}" > src/.env

      - name: Install and Initialize Cloudflare WARP
        run: |
          # Add Cloudflare GPG key and APT repository
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          # Install warp-cli
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

          # Register client and configure tunnel mode
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect

          # Verify tunnel connection
          sleep 3
          warp-cli --accept-tos status

      - name: Verify Clean Non-Datacenter Egress
        run: |
          echo "=== Egress Verification ==="
          curl -s https://cloudflare.com/cdn-cgi/trace | grep -E "ip|loc|warp" || true
          curl -s https://ipinfo.io/json || true

      - name: Build Docker image
        run: docker build -f scraper.Dockerfile -t courses-api-scraper:latest .

      - name: Probe direct host connectivity (optional)
        if: ${{ inputs.probe_hosts == true }}
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/scripts:/app/scripts \
            courses-api-scraper:latest python scripts/probe_hosts.py -n 10

      - name: Run scraper
        if: ${{ inputs.probe_hosts != true }}
        timeout-minutes: 180
        run: |
          mkdir -p logs
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/src:/app/src \
            -v ${{ github.workspace }}/logs:/app/logs \
            -e PYTHONUNBUFFERED=1 \
            -e GITHUB_ACTIONS=true \
            -e USE_WARP=true \
            -e DEFAULT_LOGGING_LEVEL=${{ env.DEFAULT_LOGGING_LEVEL }} \
            -e COURSE_WORKERS=24 \
            -e SUBJECT_WORKERS=6 \
            courses-api-scraper:latest

      - name: Upload scraper log artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scraper-log
          path: logs/*.log
          if-no-files-found: warn

      - name: Rename SQLite DB to local.sqlite3
        run: mv src/dev.sqlite3 src/local.sqlite3

      - name: Validate Database Size and Integrity
        run: |
          DB_SIZE=$(stat -c%s "src/local.sqlite3" 2>/dev/null || stat -f%z "src/local.sqlite3")
          LIMIT=$((50 * 1024 * 1024))
          echo "Database size: $DB_SIZE bytes (Required limit: $LIMIT bytes)"
          if [ "$DB_SIZE" -lt "$LIMIT" ]; then
            echo "Error: Database file size is less than 50MB. Scraping might have failed or been blocked."
            exit 1
          fi
          COURSE_COUNT=$(python3 -c "import sqlite3; conn = sqlite3.connect('src/local.sqlite3'); print(conn.execute('SELECT count(*) FROM courses').fetchone()[0])" 2>/dev/null || echo "0")
          echo "Total courses in DB: $COURSE_COUNT"
          if [ "$COURSE_COUNT" -lt 10000 ]; then
            echo "Error: Course count ($COURSE_COUNT) is below expected 10,000 threshold."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: ${{ secrets.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload DB to S3
        run: |
          aws s3 cp src/local.sqlite3 s3://${{ secrets.AWS_S3_BUCKET }}/courses-api/

      - name: Download DB and restart courses-api container on EC2
        env:
          KEY: ${{ secrets.SSH_EC2_KEY }}
          HOSTNAME: ${{ secrets.SSH_EC2_HOSTNAME }}
          USER: ${{ secrets.SSH_EC2_USER }}
        run: |
          echo "$KEY" > private_key && chmod 600 private_key
          ssh -v -o StrictHostKeyChecking=no -i private_key ${USER}@${HOSTNAME} '
            cd ~/courses-api
            aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/courses-api/local.sqlite3 .
            docker restart courses-api
          '
